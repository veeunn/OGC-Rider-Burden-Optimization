name: Run Stage 1 batch

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Pilot first, then all 18 Stage 1 instances"
        required: true
        default: "pilot"
        type: choice
        options:
          - pilot
          - all
      population_size:
        description: "NSGA-II population size"
        required: true
        default: "12"
      generations:
        description: "NSGA-II generations"
        required: true
        default: "5"
      seed:
        description: "Random seed"
        required: true
        default: "0"
      metric:
        description: "Equity metric"
        required: true
        default: "gini"
        type: choice
        options:
          - gini
          - std
          - range
          - max
          - cv

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.matrix.outputs.instances }}
    steps:
      - id: matrix
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$SCOPE" = "pilot" ]; then
            echo 'instances=["STAGE1_1","STAGE1_3"]' >> "$GITHUB_OUTPUT"
          else
            echo 'instances=["STAGE1_1","STAGE1_2","STAGE1_3","STAGE1_4","STAGE1_5","STAGE1_6","STAGE1_7","STAGE1_8","STAGE1_9","STAGE1_10","STAGE1_11","STAGE1_12","STAGE1_13","STAGE1_14","STAGE1_15","STAGE1_16","STAGE1_17","STAGE1_18"]' >> "$GITHUB_OUTPUT"
          fi

  experiment:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance: ${{ fromJSON(needs.prepare.outputs.instances) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.instance }}
        run: |
          python scripts/runners/run_all_scenarios.py \
            --problem 01_data/stage1/${{ matrix.instance }}.json \
            --timelimit 120 \
            --population-size ${{ inputs.population_size }} \
            --generations ${{ inputs.generations }} \
            --seed ${{ inputs.seed }} \
            --metric ${{ inputs.metric }}

      - name: Upload ${{ matrix.instance }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.instance }}
          path: 05_results/
          if-no-files-found: warn

  summarize:
    needs: experiment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Stage 1 result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage1-*
          path: collected

      - name: Aggregate results
        run: |
          python scripts/summarize_stage1.py --root collected --out-dir stage1_summary
          cat stage1_summary/stage1_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage 1 summary
        uses: actions/upload-artifact@v4
        with:
          name: stage1-summary
          path: stage1_summary/
